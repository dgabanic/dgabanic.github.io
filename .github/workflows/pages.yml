# .github/workflows/pages.yml
name: Deploy site

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # NOTE: VITE_* vars are inlined into the public bundle at build time.
      # The Gist token is therefore publicly extractable from the deployed
      # site. Use a fine-grained PAT scoped to ONLY the "Gists" permission.
      - run: npm run build
        env:
          VITE_GIST_ID: ${{ secrets.VITE_GIST_ID }}
          VITE_GIST_TOKEN: ${{ secrets.VITE_GIST_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4